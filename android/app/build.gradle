apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def loadClubCarderEnv = { File file ->
    def values = [:]
    if (!file.exists()) return values
    file.eachLine { line ->
        def trimmed = line.trim()
        if (!trimmed || trimmed.startsWith('#') || !trimmed.contains('=')) return
        def separator = trimmed.indexOf('=')
        def key = trimmed.substring(0, separator).trim()
        def value = trimmed.substring(separator + 1).trim()
        if (value.length() >= 2 && ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'")))) {
            value = value.substring(1, value.length() - 1)
        }
        values[key] = value
    }
    return values
}

def clubCarderEnv = loadClubCarderEnv(new File(rootProject.projectDir.parentFile, '.env'))
def escapeBuildConfig = { String value ->
    (value ?: '').replace('\\', '\\\\').replace('"', '\\"')
}
def nativeSupabaseUrl = clubCarderEnv['VITE_SUPABASE_URL'] ?: clubCarderEnv['SUPABASE_URL'] ?: ''
def nativeSupabaseKey = clubCarderEnv['VITE_SUPABASE_PUBLISHABLE_KEY'] ?: clubCarderEnv['SUPABASE_PUBLISHABLE_KEY'] ?: ''

android {
    namespace = "com.clubcarder.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.clubcarder.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "SUPABASE_URL", "\"${escapeBuildConfig(nativeSupabaseUrl)}\""
        buildConfigField "String", "SUPABASE_PUBLISHABLE_KEY", "\"${escapeBuildConfig(nativeSupabaseKey)}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig true
        compose true
    }
    kotlinOptions {
        // Must match the Java level in capacitor.build.gradle, which is applied
        // after this block and is regenerated by `capacitor update` — hence no
        // compileOptions here to conflict with it.
        jvmTarget = '21'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.googlecode.libphonenumber:libphonenumber:9.0.38"

    // Compose, for the native sign-in screen.
    implementation platform("androidx.compose:compose-bom:$composeBomVersion")
    implementation "androidx.activity:activity-compose:$androidxActivityComposeVersion"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-core"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$androidxLifecycleVersion"
    debugImplementation "androidx.compose.ui:ui-tooling"

    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
