// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    // Declared here rather than in variables.gradle: Gradle evaluates the
    // buildscript block before any `apply from`, so the plugin classpath
    // cannot see values defined there.
    ext.kotlinVersion = '2.1.0'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        // From Kotlin 2.0 the Compose compiler ships with Kotlin itself and is
        // versioned together with it.
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlinVersion"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
